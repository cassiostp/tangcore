name: Core bitstreams

# Builds a core's FPGA bitstream (Tang Console boards) with the free Gowin
# EDA Education edition on a GitHub-hosted ubuntu runner. The toolchain is
# downloaded from the vendor CDN at build time and cached; it must never be
# committed, uploaded or redistributed (the download itself is allowed, and
# the Education edition needs no licence).

on:
  workflow_dispatch:
    inputs:
      core:
        description: Core to build
        type: choice
        options: [nestang, snestang, gbatang, mdtang, smstang]
        default: nestang
        required: true
      ref:
        description: Branch / tag / SHA in cassiostp/<core> (empty = its default branch)
        type: string
        required: false
        default: ''
      board:
        description: TangCore board
        type: choice
        options: [console138k, console60k]
        default: console138k
        required: true

  # TEMPORARY while this workflow is under development: every push to
  # ci/core-builds builds nestang at its default branch (inputs fall back to
  # their defaults). The parent will remove this trigger once stable.
  push:
    branches: [ci/core-builds]

permissions:
  contents: read

concurrency:
  group: cores-${{ github.ref }}-${{ inputs.core || 'nestang' }}-${{ inputs.board || 'console138k' }}
  cancel-in-progress: true

env:
  GOWIN_VERSION: 1.9.11.03

jobs:
  build:
    name: ${{ inputs.core || 'nestang' }} / ${{ inputs.board || 'console138k' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CORE: ${{ inputs.core || 'nestang' }}
      BOARD: ${{ inputs.board || 'console138k' }}
      CORE_REF: ${{ inputs.ref }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get autoremove --purge -qq || true
          df -h /

      - name: Check out tangcore
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve core ref
        id: core-ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$CORE_REF"
          if [ -z "$ref" ]; then
            ref=$(gh api "repos/cassiostp/$CORE" --jq .default_branch)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building cassiostp/$CORE at $ref"

      - name: Restore cached Gowin EDA
        id: gowin-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/gowin
          key: gowin-${{ env.GOWIN_VERSION }}-education-linux-${{ runner.arch }}

      - name: Install Gowin EDA Education
        env:
          CACHE_HIT: ${{ steps.gowin-cache.outputs.cache-hit }}
        run: |
          set -eo pipefail
          # Re-check the tree itself, so a corrupt or empty cache entry (e.g.
          # saved from a run whose download failed) is never fatal.
          if [ "$CACHE_HIT" = "true" ] && find "$HOME/gowin" -type f -path '*/IDE/bin/gw_sh' | grep -q .; then
            echo "using cached Gowin V$GOWIN_VERSION"
            exit 0
          fi
          trap 'rm -rf "$HOME/gowin"' ERR
          rm -rf "$HOME/gowin"
          # The vendor CDN answers 403 (ua-black) to default curl/wget
          # user-agents, so pose as a browser. ~680 MB.
          curl -fSL --retry 5 --retry-delay 15 -o /tmp/gowin.tar.gz \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' \
            "https://cdn.gowinsemi.com.cn/Gowin_V${GOWIN_VERSION}_Education_Linux.tar.gz"
          mkdir -p "$HOME/gowin"
          tar -zxf /tmp/gowin.tar.gz -C "$HOME/gowin"
          rm -f /tmp/gowin.tar.gz

      - name: Locate gw_sh
        run: |
          set -eo pipefail
          gws=$(find "$HOME/gowin" -type f -path '*/IDE/bin/gw_sh' | head -n1)
          if [ -z "$gws" ]; then
            echo "::error::gw_sh not found in the extracted Gowin tree"
            find "$HOME/gowin" -maxdepth 3 | head -n 40
            exit 1
          fi
          echo "GOWIN_ROOT=$(dirname "$(dirname "$gws")")" >> "$GITHUB_ENV"

      - name: Install system libraries
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          pkgs='libgl1 libglx-mesa0 libfontconfig1 libfreetype6 libxrender1 libxkbcommon0 libdbus-1-3 libncurses6 zlib1g'
          # libglib2.0-0 has the t64 suffix on Ubuntu 24.04
          sudo apt-get install -y -qq --no-install-recommends $pkgs libglib2.0-0t64 ||
            sudo apt-get install -y -qq --no-install-recommends $pkgs libglib2.0-0

      - name: Check out core sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cassiostp/${{ env.CORE }}
          ref: ${{ steps.core-ref.outputs.ref }}
          path: core-src
          submodules: recursive
          persist-credentials: false

      - name: Build bitstream
        working-directory: core-src
        env:
          QT_QPA_PLATFORM: offscreen
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libfreetype.so.6
          LD_LIBRARY_PATH: ${{ env.GOWIN_ROOT }}/IDE/lib
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf impl/gwsynthesis impl/pnr
          "$GOWIN_ROOT/IDE/bin/gw_sh" build.tcl "$BOARD" 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check timing and bitstream
        working-directory: core-src
        run: |
          set +eo pipefail
          shopt -s nullglob
          bins=(impl/pnr/*.bin)
          trs=(impl/pnr/*.tr)
          fail=0
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::no .bin produced under impl/pnr/ (see build.log)"
            fail=1
          fi
          if [ ${#trs[@]} -eq 0 ]; then
            echo "::error::no timing report (.tr) under impl/pnr/"
            fail=1
          else
            tr="${trs[0]}"
            for kind in Setup Hold; do
              n=$(sed -n "s/.*<Numbers of ${kind} Violated Endpoints>:\([0-9][0-9]*\).*/\1/p" "$tr" | head -n1)
              if [ -z "$n" ]; then
                echo "::error::could not read $kind violation count from $tr"
                fail=1
              elif [ "$n" -gt 0 ]; then
                echo "::error::$kind timing violations: $n endpoint(s)"
                fail=1
              fi
            done
            {
              echo "## $CORE / $BOARD"
              echo
              echo "### Timing (Max Frequency Summary)"
              echo '```'
              awk '/Max Frequency Summary/{f=1} f{print} f&&/Negative Slack Summary/{exit}' "$tr" | grep -vE '^No timing paths' | head -n 30
              echo '```'
              echo "### Resources"
              echo '```'
              rpt=$(ls impl/pnr/*.rpt.txt 2>/dev/null | head -n1)
              [ -n "$rpt" ] && grep -E '^[ ]*(Logic|Register|CLS|BSRAM|I/O Port|DSP)' "$rpt" | head -n 10
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $fail

      - name: Collect artifact files
        if: always()
        run: |
          set +e
          mkdir -p dist
          cp core-src/build.log dist/build.log 2>/dev/null
          bin=$(ls core-src/impl/pnr/*.bin 2>/dev/null | head -n1)
          # rename to the file name TangCore's firmware looks for on the SD card
          [ -n "$bin" ] && cp "$bin" "dist/$CORE.bin"
          true

      - name: Upload bitstream and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CORE }}-${{ env.BOARD }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30
