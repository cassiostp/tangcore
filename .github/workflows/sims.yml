name: Save-RAM sims

# Runs the save-RAM iverilog testbenches of the cores (sim/saveram/run.sh in
# each cassiostp/<core> repo) on GitHub-hosted ubuntu runners. A testbench that
# fails exits non-zero, so the matrix job fails with it. Cores without a
# sim/saveram directory at the chosen ref are skipped with a notice.

on:
  workflow_dispatch:
    inputs:
      core:
        description: Core to simulate
        type: choice
        options: [all, nestang, snestang, gbatang, mdtang, smstang]
        default: all
        required: true
      ref:
        description: Branch / tag / SHA in cassiostp/<core>
        type: string
        required: false
        default: feature/battery-saves


permissions:
  contents: read

concurrency:
  group: sims-${{ inputs.core }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select cores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cores: ${{ steps.pick.outputs.cores }}
    steps:
      - name: Expand the core input
        id: pick
        env:
          CORE: ${{ inputs.core }}
        run: |
          case "$CORE" in
            all) cores='["nestang","snestang","gbatang","mdtang","smstang"]' ;;
            *)   cores="[\"$CORE\"]" ;;
          esac
          echo "cores=$cores" >> "$GITHUB_OUTPUT"
          echo "Simulating: $cores"

  sim:
    name: ${{ matrix.core }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.plan.outputs.cores) }}
    env:
      CORE: ${{ matrix.core }}
      CORE_REF: ${{ inputs.ref }}
    steps:
      - name: Check out core sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cassiostp/${{ env.CORE }}
          ref: ${{ inputs.ref }}
          path: core-src
          persist-credentials: false

      - name: Look for the save-RAM sims
        id: sims
        run: |
          if [ -d core-src/sim/saveram ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$CORE has no sim/saveram at '$CORE_REF'; skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Icarus Verilog
        if: steps.sims.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends iverilog
          iverilog -V | head -n 1

      - name: Run the testbenches
        if: steps.sims.outputs.present == 'true'
        working-directory: core-src/sim/saveram
        run: sh run.sh

      - name: Upload waveforms on failure
        if: failure() && steps.sims.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CORE }}-saveram-vcd
          path: core-src/sim/saveram/**/*.vcd
          if-no-files-found: ignore
          retention-days: 14
